name: pose_detection_example
description: Example app for pose_detection
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  file_selector: ^1.1.0
  file_selector_macos: ^0.9.5
  pose_detection:
    path: ../
  # Direct dependency so the example can import OneEuroFilter (and CompiledModel
  # benchmarks can import flutter_litert).
  flutter_litert: ^3.9.1
  flutter_colorpicker: ^1.1.0
  path_provider: ^2.1.5
  camera: ^0.12.0
  camera_desktop: ^1.2.2
  opencv_dart: ^2.2.2
  dartcv4: ^2.3.1
  sensors_plus: ^6.1.1
  video_player: ^2.9.2

# video_player_avfoundation 2.9.7's macOS Swift Package imports the iOS-only
# <Flutter/Flutter.h> module, which fails to build on macOS ("module 'Flutter'
# not found"). Pin to 2.9.4, the last version that builds on macOS, until the
# upstream package is fixed.
dependency_overrides:
  video_player_avfoundation: 2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    dartcv4:
      # Xcode 27 rejects deployment targets below iOS 15. dartcv4 2.3.1 reads the
      # iOS target from here and takes the macOS one from the Runner (the earlier
      # 2.2.1+4 hardcoded 12.0 / 10.15, which needed a patched fork). Hook
      # user-defines are only honoured from the root package, so every consuming
      # app sets this.
      ios:
        deployment_target: '15.0'
      include_modules:
        - imgcodecs
        - imgproc
        - videoio

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
