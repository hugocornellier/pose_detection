name: pose_detection_example
description: Example app for pose_detection
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  file_selector: ^1.1.0
  file_selector_macos: ^0.9.5
  pose_detection:
    path: ../
  # Direct dependency so the example can import OneEuroFilter (and CompiledModel
  # benchmarks can import flutter_litert).
  flutter_litert: ^3.5.1
  flutter_colorpicker: ^1.1.0
  path_provider: ^2.1.5
  camera: ^0.12.0
  camera_desktop: ^1.2.1
  opencv_dart: ^2.2.1+4
  sensors_plus: ^6.1.1
  video_player: ^2.9.2

# video_player_avfoundation 2.9.7's macOS Swift Package imports the iOS-only
# <Flutter/Flutter.h> module, which fails to build on macOS ("module 'Flutter'
# not found"). Pin to 2.9.4, the last version that builds on macOS, until the
# upstream package is fixed.
dependency_overrides:
  video_player_avfoundation: 2.9.4
  # dartcv4 2.2.1+4 hardcodes macOS DEPLOYMENT_TARGET=10.15 in its build hook,
  # which the Xcode 27 SDK rejects (minimum is 12.0), so the CMake try-compile
  # fails and the whole macOS build dies. Point at a patched fork of the exact
  # 2.2.1+4 release (10.15 raised to 12.0) until upstream ships a fix.
  dartcv4:
    git:
      url: https://github.com/hugocornellier/opencv_dart.git
      ref: 4c10de166f225c7093ed4cd9afe373d37955492a
      path: packages/dartcv

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
        - videoio

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
